name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm test && pnpm build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify backend
        run: |
          python -m pip install --disable-pip-version-check -e "./backend[dev]"
          ruff check backend/src backend/tests
          ruff format --check backend/src backend/tests
          cd backend && pytest

      - name: Build container
        run: docker build --tag stockroom-ledger:${GITHUB_REF_NAME} .

      - name: Package source bundle
        run: git archive --format=tar.gz --output "stockroom-ledger-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "stockroom-ledger-${GITHUB_REF_NAME}.tar.gz" --verify-tag --generate-notes --title "Stockroom Ledger $GITHUB_REF_NAME"
