name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install --disable-pip-version-check -e "./backend[dev]"

      - name: Lint
        run: ruff check backend/src backend/tests

      - name: Check formatting
        run: ruff format --check backend/src backend/tests

      - name: Test
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag stockroom-ledger:test .

      - name: Build Vercel image
        run: docker build --file Dockerfile.vercel --tag stockroom-ledger:vercel .

      - name: Inspect Vercel runtime user
        run: test "$(docker run --rm --entrypoint=id stockroom-ledger:vercel -u)" != "0"

      - name: Inspect runtime user
        run: test "$(docker run --rm --entrypoint=id stockroom-ledger:test -u)" != "0"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stockroom-ledger:test
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test image
        run: |
          docker run --detach --name stockroom-smoke --publish 18000:8000 stockroom-ledger:test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then
              curl --fail --silent http://127.0.0.1:18000/api/dashboard | grep --quiet 'totalUnits'
              exit 0
            fi
            sleep 1
          done
          docker logs stockroom-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force stockroom-smoke || true
