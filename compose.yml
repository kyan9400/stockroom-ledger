services:
  stockroom:
    build:
      context: .
    image: stockroom-ledger:1.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - stockroom-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped

volumes:
  stockroom-data:

